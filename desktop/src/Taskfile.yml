version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "Octop"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Build-time default dashboard URL for the shell (Windows release builds bake
  # this in via -ldflags "-X main.defaultServerURL=..."). Must be a GLOBAL var:
  # go-task renders var templates with only call vars + globals in scope, so a
  # task-level default would be invisible to BUILD_FLAGS. Override per build
  # with: wails3 task build DEFAULT_SERVER_URL=https://host/prefix
  DEFAULT_SERVER_URL: "https://ocbot.aixifs.com/videogen"
  # Optional HTTPS URL for the separately built video component installer.
  # Leave empty until an official release asset is available.
  VIDEO_COMPONENTS_URL: ""

tasks:
  build:
    summary: Builds the Octop desktop shell
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the built binary
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Dev mode (watches Go, rebuilds)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
