version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Windows binary
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - task: generate:syso
        vars:
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags {{if .DEFAULT_SERVER_URL}}production,thin{{else}}production{{end}}{{if or .PORTABLE_RUNTIME_URL .PORTABLE_RUNTIME_MANIFEST_URL}},downloadruntime{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui{{if .DEFAULT_SERVER_URL}} -X main.defaultServerURL={{.DEFAULT_SERVER_URL}}{{end}}{{if .VIDEO_COMPONENTS_URL}} -X main.defaultVideoComponentsURL={{.VIDEO_COMPONENTS_URL}}{{end}}{{if .PORTABLE_RUNTIME_URL}} -X main.portableRuntimeURL={{.PORTABLE_RUNTIME_URL}}{{end}}{{if .PORTABLE_RUNTIME_MANIFEST_URL}} -X main.portableRuntimeManifestURL={{.PORTABLE_RUNTIME_MANIFEST_URL}}{{end}}{{if .PORTABLE_RUNTIME_MANIFEST_SHA256}} -X main.portableRuntimeManifestSHA256={{.PORTABLE_RUNTIME_MANIFEST_SHA256}}{{end}}{{if or .PORTABLE_RUNTIME_URL .PORTABLE_RUNTIME_MANIFEST_URL}} -X main.portableRuntimeVersion={{.VERSION}}{{end}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      VERSION: '{{.VERSION | default "dev"}}'
    env:
      GOOS: windows
      CGO_ENABLED: "0"
      GOARCH: "{{.ARCH | default ARCH}}"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  stage:portable:
    summary: Copies the green zip to bundled/portable.zip for go:embed
    cmds:
      - cmd: >-
          powershell -NoProfile -Command
          "if (-not (Test-Path '{{.PORTABLE_ZIP}}')) { throw 'portable zip not found: {{.PORTABLE_ZIP}}' };
          New-Item -ItemType Directory -Force bundled | Out-Null;
          Copy-Item -Force '{{.PORTABLE_ZIP}}' 'bundled/portable.zip'"
    vars:
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-portable-windows-%s-%s.zip" (.ARCH | default ARCH) (.VERSION | default "dev"))}}'

  package:
    summary: Packages the thin remote client or existing full local client
    cmds:
      - task: '{{if or .PORTABLE_RUNTIME_URL .PORTABLE_RUNTIME_MANIFEST_URL}}package:slim{{else if .DEFAULT_SERVER_URL}}package:thin{{else}}package:full{{end}}'

  package:slim:
    summary: Packages the shell that fetches the portable runtime on first launch
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          # A slim client runs the local runtime, so it must not carry a remote
          # dashboard target — that would skip the runtime download entirely.
          DEFAULT_SERVER_URL: ""
          PORTABLE_RUNTIME_URL: "{{.PORTABLE_RUNTIME_URL}}"
          PORTABLE_RUNTIME_MANIFEST_URL: "{{.PORTABLE_RUNTIME_MANIFEST_URL}}"
          PORTABLE_RUNTIME_MANIFEST_SHA256: "{{.PORTABLE_RUNTIME_MANIFEST_SHA256}}"
          VIDEO_COMPONENTS_URL: "{{.VIDEO_COMPONENTS_URL}}"
      - task: create:nsis:installer
        vars:
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          OUTPUT_NAME: "{{.OUTPUT_NAME}}"
      - cmd: >-
          powershell -NoProfile -Command
          "Remove-Item -Force '{{.BIN_DIR}}/{{.APP_NAME}}-Desktop-windows-{{.ARCH}}.zip' -ErrorAction SilentlyContinue;
          Remove-Item -Force 'bundled/portable.zip' -ErrorAction SilentlyContinue;
          exit 0"
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      VERSION: '{{.VERSION | default "dev"}}'
      OUTPUT_NAME: '{{.APP_NAME}}-desktop-slim-windows-{{.ARCH}}-{{.VERSION}}.exe'

  package:thin:
    summary: Packages the remote client without Python or video components
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          DEFAULT_SERVER_URL: "{{.DEFAULT_SERVER_URL}}"
          VIDEO_COMPONENTS_URL: "{{.VIDEO_COMPONENTS_URL}}"
      - task: create:nsis:installer
        vars:
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          OUTPUT_NAME: "{{.APP_NAME}}-desktop-windows-{{.ARCH}}-{{.VERSION}}.exe"
      - cmd: >-
          powershell -NoProfile -Command
          "Remove-Item -Force '{{.BIN_DIR}}/{{.APP_NAME}}-Desktop-windows-{{.ARCH}}.zip' -ErrorAction SilentlyContinue;
          Remove-Item -Force 'bundled/portable.zip' -ErrorAction SilentlyContinue;
          exit 0"
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      VERSION: '{{.VERSION | default "dev"}}'

  package:full:
    summary: Packages the existing full local client with its portable Python runtime
    cmds:
      - task: stage:portable
        vars:
          ARCH: "{{.ARCH}}"
          PORTABLE_ZIP: "{{.PORTABLE_ZIP}}"
      - task: build
        vars:
          PRODUCTION: "true"
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          DEFAULT_SERVER_URL: "{{.DEFAULT_SERVER_URL}}"
          VIDEO_COMPONENTS_URL: "{{.VIDEO_COMPONENTS_URL}}"
      - task: create:nsis:installer
        vars:
          ARCH: "{{.ARCH}}"
          VERSION: "{{.VERSION}}"
          OUTPUT_NAME: "{{.APP_NAME}}-desktop-windows-{{.ARCH}}-{{.VERSION}}.exe"
      - cmd: >-
          powershell -NoProfile -Command
          "Remove-Item -Force '{{.BIN_DIR}}/{{.APP_NAME}}-Desktop-windows-{{.ARCH}}.zip' -ErrorAction SilentlyContinue;
          Remove-Item -Force '{{.BIN_DIR}}/{{.APP_NAME}}-Desktop-windows-{{.ARCH}}.exe' -ErrorAction SilentlyContinue;
          Remove-Item -Recurse -Force '{{.BIN_DIR}}/{{.APP_NAME}}-Desktop-windows-{{.ARCH}}' -ErrorAction SilentlyContinue;
          Remove-Item -Force 'bundled/portable.zip' -ErrorAction SilentlyContinue;
          exit 0"
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      VERSION: '{{.VERSION | default "dev"}}'
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-portable-windows-%s-%s.zip" .ARCH .VERSION)}}'

  create:nsis:installer:
    summary: Wraps Octop.exe in an NSIS installer (Program Files + shortcuts)
    dir: build/windows/nsis
    preconditions:
      - sh: '"{{.MAKENSIS}}" -VERSION'
        msg: "The workspace-local NSIS compiler is missing."
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - cmd: >-
          powershell -NoProfile -Command
          "Remove-Item -Force '{{.ROOT_DIR}}/{{.INSTALLER_OUTFILE}}' -ErrorAction SilentlyContinue;
          New-Item -ItemType Directory -Force '{{.ROOT_DIR}}/{{.BIN_DIR}}' | Out-Null"
      # Emit version_defines.nsh so makensis never needs shell $vars (PowerShell eats $filever).
      - cmd: python "{{.ROOT_DIR}}/build/stamp_version.py" nsis-defines "{{.VERSION}}" version_defines.nsh
        platforms: [windows]
      - cmd: python3 "{{.ROOT_DIR}}/build/stamp_version.py" nsis-defines "{{.VERSION}}" version_defines.nsh
        platforms: [linux, darwin]
      - cmd: >-
          "{{.MAKENSIS}}"
          /INPUTCHARSET UTF8
          -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe"
          -DINSTALLER_OUTFILE="{{.ROOT_DIR}}\{{.INSTALLER_OUTFILE}}"
          project.nsi
        platforms: [windows]
      - cmd: >-
          "{{.MAKENSIS}}"
          /INPUTCHARSET UTF8
          -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe"
          -DINSTALLER_OUTFILE="{{.ROOT_DIR}}/{{.INSTALLER_OUTFILE}}"
          project.nsi
        platforms: [linux, darwin]
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      VERSION: '{{.VERSION | default "dev"}}'
      # Display / outfile / registry keep pep440; INFO_FILEVERSION is numeric X.X.X.X.
      ARG_FLAG: '{{if eq (.ARCH | default ARCH) "amd64"}}AMD64{{else}}ARM64{{end}}'
      # The caller decides the file name (full / thin / slim differ).
      # go-task lets a task's own `vars:` override the caller's, so the name
      # arrives as OUTPUT_NAME and is assembled here.
      INSTALLER_OUTFILE: '{{.BIN_DIR}}/{{.OUTPUT_NAME}}'
      MAKENSIS: '{{.MAKENSIS | default "makensis"}}'

  components:package:
    summary: Builds a separate per-user Octop video components installer
    cmds:
      - cmd: node ../../remotion/build-desktop-runtime.mjs --target win-x64 --output video-runtime
      - task: create:nsis:components
        vars:
          VERSION: "{{.VERSION}}"
          MAKENSIS: "{{.MAKENSIS}}"
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      MAKENSIS: '{{.MAKENSIS | default "makensis"}}'

  components:installer:
    summary: Packages the already prepared video-runtime directory without rebuilding it
    cmds:
      - task: create:nsis:components
        vars:
          VERSION: "{{.VERSION}}"
          MAKENSIS: "{{.MAKENSIS}}"
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      MAKENSIS: '{{.MAKENSIS | default "makensis"}}'

  create:nsis:components:
    summary: Wraps video-runtime in a fixed-path per-user installer
    dir: build/windows/nsis
    cmds:
      - cmd: >-
          "{{.MAKENSIS}}"
          /INPUTCHARSET UTF8
          -DVERSION="{{.VERSION}}"
          -DINSTALLER_OUTFILE="{{.ROOT_DIR}}/{{.BIN_DIR}}/Octop-video-components-windows-x64-{{.VERSION}}.exe"
          video-components.nsi
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      MAKENSIS: '{{.MAKENSIS | default "makensis"}}'

  run:
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}.exe"

  generate:syso:
    summary: Generates Windows .syso (linked from module root)
    dir: build
    cmds:
      - cmd: python stamp_version.py json windows/info.json windows/info.generated.json "{{.VERSION}}"
        platforms: [windows]
      - cmd: python3 stamp_version.py json windows/info.json windows/info.generated.json "{{.VERSION}}"
        platforms: [linux, darwin]
      - cmd: python stamp_version.py manifest windows/wails.exe.manifest windows/wails.exe.generated.manifest "{{.VERSION}}"
        platforms: [windows]
      - cmd: python3 stamp_version.py manifest windows/wails.exe.manifest windows/wails.exe.generated.manifest "{{.VERSION}}"
        platforms: [linux, darwin]
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.generated.manifest -info windows/info.generated.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      VERSION: '{{.VERSION | default "dev"}}'
