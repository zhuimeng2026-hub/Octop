version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production{{if .PORTABLE_RUNTIME_URL}},downloadruntime{{end}} -trimpath -buildvcs=false -ldflags="-w -s{{if .PORTABLE_RUNTIME_URL}} -X main.portableRuntimeURL={{.PORTABLE_RUNTIME_URL}} -X main.portableRuntimeVersion={{.VERSION}}{{end}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: "{{.ARCH | default ARCH}}"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages the Linux client
    cmds:
      - task: '{{if .PORTABLE_RUNTIME_URL}}package:slim{{else}}package:full{{end}}'

  package:full:
    summary: Packages one production binary with its portable runtime embedded
    cmds:
      - task: stage:portable
        vars:
          PORTABLE_ZIP: "{{.PORTABLE_ZIP}}"
      - task: build
        vars:
          PRODUCTION: "true"
      - rm -f {{.ARCHIVE}} bundled/portable.zip
      - tar -C {{.BIN_DIR}} -czf {{.ARCHIVE}} {{.APP_NAME}}
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      VERSION: '{{.VERSION | default "dev"}}'
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-portable-linux-%s-%s.zip" .ARCH .VERSION)}}'
      ARCHIVE: '{{.BIN_DIR}}/{{.APP_NAME}}-desktop-linux-{{.ARCH}}-{{.VERSION}}.tar.gz'

  package:slim:
    summary: Packages the shell that fetches the portable runtime on first launch
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"
          VERSION: "{{.VERSION}}"
          PORTABLE_RUNTIME_URL: "{{.PORTABLE_RUNTIME_URL}}"
      - rm -f {{.ARCHIVE}} bundled/portable.zip
      - tar -C {{.BIN_DIR}} -czf {{.ARCHIVE}} {{.APP_NAME}}
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      VERSION: '{{.VERSION | default "dev"}}'
      ARCHIVE: '{{.BIN_DIR}}/{{.APP_NAME}}-desktop-slim-linux-{{.ARCH}}-{{.VERSION}}.tar.gz'

  stage:portable:
    summary: Copies the matching green zip for go:embed
    cmds:
      - test -f {{.PORTABLE_ZIP}}
      - mkdir -p bundled
      - cp {{.PORTABLE_ZIP}} bundled/portable.zip
    vars:
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-portable-linux-%s-%s.zip" (.ARCH | default ARCH) (.VERSION | default "dev"))}}'

  run:
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"
