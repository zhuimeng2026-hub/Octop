# Octop bootstrapper config - shared by Windows / macOS / Linux (KEY=VALUE).
# The bootstrapper itself is a few tens of KB and carries no runtime; these
# values decide what it downloads step by step.

# Target version. Empty = latest stable release on PyPI.
OCTOP_VERSION=1.1.0
PYPI_PACKAGE=octop

# Step 1: base tool (uv pulls Python and the dependencies).
UV_VERSION=0.12.22

# Step 2: Python runtime.
PYTHON_VERSION=3.12

# Step 5: service port (browser opens automatically once it is ready).
LAUNCH_PORT=8088

# Mirrors, used when "use mirror" / -Mirror is enabled.
UV_MIRROR_BASE=https://registry.npmmirror.com/-/binary/uv
PIP_INDEX_URL=https://mirrors.cloud.tencent.com/pypi/simple
